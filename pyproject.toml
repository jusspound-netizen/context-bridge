[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-bridge-mcp"
version = "0.1.2"
description = "An MCP server for Jira, Sentry, and GitHub Actions."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Gio", email = "fastonlinehq@gmail.com" }]
dependencies = ["mcp>=2.0.0"]

[project.scripts]
context-bridge = "server:main"

